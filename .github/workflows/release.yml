name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bunx nuxi typecheck

      - name: Verify starter contract tests
        run: bunx vitest run test/config/root-config.test.ts test/release/manifest-contract.test.ts test/release/archive-contract.test.ts

      - name: Build release archive
        run: bun run release:build-archive

      - name: Verify release archive
        run: bun run release:verify-archive

      - name: Publish release asset
        uses: softprops/action-gh-release@v2
        with:
          files: dist/starter-web-v*.tar.gz
